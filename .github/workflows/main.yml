name: Build Android App & Auto-Release

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests python-telegram-bot python-dotenv

    - name: Verify Python Script Syntax
      run: |
        python -m py_compile main.py

    - name: Compile Python to Executable / Package
      run: |
        # Kompilasi semua file .py yang ada (kecuali main.py) menjadi binary/aplikasi mandiri
        for f in *.py; do
          if [ "$f" != "main.py" ]; then
            echo "Compiling $f..."
            pyinstaller --onefile --noconsole "$f" || pyinstaller --onefile "$f"
          fi
        done

    - name: Generate Version Tag
      id: tag
      run: echo "tag_name=v1.0.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-app-apk-bundle
        path: |
          dist/
          *.py
          *.html
        if-no-files-found: ignore

    - name: Create GitHub Release with APK/Binaries
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: "Auto-App Release - ${{ steps.tag.outputs.tag_name }}"
        body: |
          🤖 **Autonomous Application Release (Moto G57 AI Agent)**
          - Aplikasi baru telah digenerate dan dikompilasi secara otomatis oleh AI.
          - Unduh file paket aplikasi siap pakai di bawah atau via Artifacts.
        files: |
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
