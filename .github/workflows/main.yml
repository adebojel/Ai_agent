name: Build and Auto-Release AI Agent

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar GitHub Actions bisa membuat Release otomatis

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-telegram-bot python-dotenv

    - name: Verify Python Script Syntax
      run: |
        python -m py_compile main.py

    - name: Generate Version Tag
      id: tag
      run: echo "tag_name=v1.0.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-agent-bundle
        path: |
          main.py
          .env.example
          *.py
          *.html

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: "Auto Release AI Agent - ${{ steps.tag.outputs.tag_name }}"
        body: |
          🤖 **Automated Release by AI Agent (Moto G57 Environment)**
          - File utama `main.py` diperbarui secara otonom.
          - Paket aplikasi dan skrip telah dikompilasi dan diunggah ke Artifacts.
        files: |
          main.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
